<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wiki · Hope2333</title>
<style>
:root{
  --base:#1e1e2e;--mantle:#181825;--crust:#11111b;
  --text:#cdd6f4;--subtext0:#a6adc8;
  --mauve:#cba6f7;--blue:#89b4fa;--green:#a6e3a1;--red:#f38ba8;--peach:#fab387;
  --radius:12px;
  --s1:.5rem;--s2:.75rem;--s3:1rem;--s4:1.5rem;--s5:2rem;--s6:3rem;
  --mono:"JetBrains Mono","Fira Code",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
::selection{background:color-mix(in srgb,var(--red) 32%,transparent)}
body{background:var(--base);color:var(--text);font-family:var(--sans);line-height:1.7;min-height:100vh}
.wrap{max-width:46rem;margin:0 auto;padding:var(--s6) var(--s4) var(--s5)}
.kicker{font-family:var(--mono);font-size:.8rem;letter-spacing:.18em;text-transform:uppercase;color:var(--subtext0)}
h1{font-family:var(--mono);font-size:1.7rem;margin-top:var(--s1)}
.bar{height:2px;border:0;margin-top:var(--s3);background:linear-gradient(90deg,var(--mauve),var(--blue),var(--green),var(--peach));border-radius:1px}
.note{margin-top:var(--s5);padding:var(--s3) var(--s4);border-left:3px solid var(--mauve);background:color-mix(in srgb,var(--mauve) 8%,transparent);border-radius:0 var(--radius) var(--radius) 0;color:var(--subtext0)}
code{font-family:var(--mono);font-size:.9em;color:var(--green)}
footer{margin-top:var(--s6)}
footer a{font-family:var(--mono);font-size:.88rem;color:var(--subtext0);text-decoration:none;transition:color .15s ease}
footer a:hover{color:var(--green)}
</style>
</head>
<body>
<div class="wrap">
<header>
  <p class="kicker">hope2333.github.io / wiki</p>
  <h1>Wiki</h1>
  <hr class="bar">
</header>
<main>
  <p class="note">预留 <code>repository_dispatch(site-rebuild)</code> 聚合入口，内容由后续 Actions 灌入，当前为占位。</p>
</main>
<footer>
  <nav><a href="../">返回首页</a></nav>
</footer>
</div>
</body>
</html>
