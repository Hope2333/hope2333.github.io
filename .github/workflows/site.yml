name: Build and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "30 18 * * *"
  repository_dispatch:
    types: [site-rebuild]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  FEED_REPOS: Hope2333/codegraph-termux Hope2333/opencode-termux Hope2333/MiMoCode-Termux Hope2333/freebuff-termux Hope2333/codebuff-termux

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y apt-utils dpkg-dev

      - name: Assemble _site
        run: |
          set -euo pipefail
          mkdir -p _site
          # Copy repo root content into _site, excluding git internals and the
          # _site directory itself to avoid recursion.
          find . -maxdepth 1 -mindepth 1 ! -name '.git' ! -name '_site' -exec cp -r {} _site/ \;

      - name: Render wiki markdown
        run: |
          set -euo pipefail
          sudo apt-get install -y pandoc
          mkdir -p _site/wiki/guides _site/wiki/projects
          find wiki -name '*.md' -not -path 'wiki/tpl/*' | while read -r f; do
            out="_site/${f%.md}.html"
            mkdir -p "$(dirname "$out")"
            pandoc "$f" -f gfm -t html5 --template wiki/tpl/doc.html --metadata lang=zh-CN --metadata title="$(basename "$f" .md)" -o "$out"
          done

      - name: Fetch release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Scan ALL releases of every feed repo and keep only the LATEST version
          # of each package (same latest-per-package scoping philosophy as
          # gen-packages-index.py). A latest-release-only scan regressed the
          # unified db twice: MiMoCode's pinned prerelease tag (Push260829)
          # ships an older mimocode-glibc than the older Push260803 tag, and
          # opencode-glibc-standalone exists only on non-latest tags
          # (Push260828 / Push260903rc1).
          mkdir -p feed
          manifest="feed/pacman.manifest"
          : > "$manifest"
          for repo in $FEED_REPOS; do
            if ! tags="$(gh api "repos/$repo/releases?per_page=100" --paginate --jq '.[].tag_name' 2>/dev/null)" || [ -z "$tags" ]; then
              echo "::warning ::no releases for $repo (skipping feed)"
              printf '::warning ::no releases for %s (skipping feed)\n' "$repo" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            for tag in $tags; do
              assets="$(gh api "repos/$repo/releases/tags/$tag" --jq '.assets[] | "\(.id)\t\(.name)"' 2>/dev/null)" || assets=""
              printf '%s\n' "$assets" | while IFS=$'\t' read -r id name; do
                [ -n "$id" ] || continue
                case "$name" in
                  *.pkg.tar.xz|*.pkg.tar.gz) ;;
                  *) continue ;;
                esac
                base="${name%.*pkg.tar.*}"
                parsed="$(printf '%s' "$base" | sed -E 's/^(.*)-([0-9][0-9A-Za-z.]*)-([0-9]+)-([A-Za-z0-9_]+)$/\1\t\2\t\3\t\4/')" || { echo "::warning ::unparseable pkg asset name: $name"; continue; }
                [ "$parsed" != "$base" ] || { echo "::warning ::unparseable pkg asset name: $name"; continue; }
                # legacy/renamed packages stay out of the dbs: opencode-native is
                # the pre-rename name of opencode (mainline inherited the plain
                # name at Push260828); bun-termux / opencode-termux are
                # EarlyEmergencyRelease0 artifacts of the pre-transplant line.
                case "${parsed%%$'\t'*}" in
                  opencode-native|bun-termux|opencode-termux) continue ;;
                esac
                printf '%s\t%s|%s|%s|%s\n' "$parsed" "$repo" "$tag" "$id" "$name" >> "$manifest"
              done
            done
          done
          # Rolling mirrorlist release on THIS repo: its newest versioned pkg
          # joins the unified pool so [hope2333] can install/upgrade
          # hope2333-mirrorlist from every server. The -latest-1 alias is
          # excluded: a db entry pinned to the alias version would never
          # compare as an upgrade (vercmp ranks "latest" below any numeric
          # pkgver, so an installed copy would always look newer).
          ml_assets="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/mirrorlist" --jq '.assets[] | "\(.id)\t\(.name)"' 2>/dev/null)" || ml_assets=""
          printf '%s\n' "$ml_assets" | while IFS=$'\t' read -r id name; do
            [ -n "$id" ] || continue
            case "$name" in
              hope2333-mirrorlist-latest-*.pkg.tar.xz) continue ;;
              *.pkg.tar.xz|*.pkg.tar.gz) ;;
              *) continue ;;
            esac
            base="${name%.*pkg.tar.*}"
            parsed="$(printf '%s' "$base" | sed -E 's/^(.*)-([0-9][0-9A-Za-z.]*)-([0-9]+)-([A-Za-z0-9_]+)$/\1\t\2\t\3\t\4/')" || { echo "::warning ::unparseable pkg asset name: $name"; continue; }
            [ "$parsed" != "$base" ] || { echo "::warning ::unparseable pkg asset name: $name"; continue; }
            printf '%s\t%s|%s|%s|%s\n' "$parsed" "$GITHUB_REPOSITORY" "mirrorlist" "$id" "$name" >> "$manifest"
          done
          # dedupe: highest pkgver (then pkgrel) per pkgname; download winners only
          winners="$(sort -t$'\t' -k1,1 -k2,2V -k3,3n "$manifest" | awk -F'\t' '{m[$1]=$0} END{for (k in m) print m[k]}')"
          [ -n "$winners" ] || { echo "::error::no pacman pkg assets found across feed repos"; exit 1; }
          printf '%s\n' "$winners" | while IFS=$'\t' read -r pname ver rel arch meta; do
            IFS='|' read -r repo tag id name <<<"$meta"
            mkdir -p "feed/pacman/${repo##*/}"
            echo "fetch $name ($repo@$tag)"
            gh api -H "Accept: application/octet-stream" "repos/$repo/releases/assets/$id" > "feed/pacman/${repo##*/}/$name"
          done

      - name: Build pacman repo
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p _site/repo/Termux/pacman
          for pool in feed/pacman/*/; do
            pool="${pool%/}"
            base="${pool##*/}"
            # the io-repo pool (mirrorlist tag fetch) only feeds the unified
            # db + the Pages pkg dir; the mirrorlist pkg is served through the
            # [hope2333] server list and has no per-pool db of its own
            if [ "$base" = "hope2333.github.io" ]; then continue; fi
            docker run --rm -v "$PWD/$pool:/work" archlinux bash -c "cd /work && repo-add $base.db.tar.gz *.pkg.tar.*"
            cp "$pool/$base.db" "$pool/$base.db.tar.gz" _site/repo/Termux/pacman/
          done
          # Unified [hope2333] db: latest packages of every feed repo in one pool
          # (fresh CI workspace => latest-only snapshot, single version cached)
          mkdir -p feed/pacman-unified
          cp feed/pacman/*/*.pkg.tar.* feed/pacman-unified/
          docker run --rm -v "$PWD/feed/pacman-unified:/work" archlinux bash -c 'cd /work && repo-add hope2333.db.tar.gz *.pkg.tar.*'
          # repo-add leaves hope2333.db as a symlink; materialize a real copy
          # so gh release upload ships content, not the link itself
          rm feed/pacman-unified/hope2333.db
          cp feed/pacman-unified/hope2333.db.tar.gz feed/pacman-unified/hope2333.db
          cp feed/pacman-unified/hope2333.db feed/pacman-unified/hope2333.db.tar.gz _site/repo/Termux/pacman/
          cp feed/pacman/*/*.pkg.tar.* _site/repo/Termux/pacman/

      - name: Publish unified db to release CDNs
        env:
          HOPE_PAT: ${{ secrets.HOPE_PAT }}
        run: |
          set -euo pipefail
          if [ -z "$HOPE_PAT" ]; then
            echo "HOPE_PAT secret not set — skipping CDN db publish (Pages fallback still serves the db)"
            exit 0
          fi
          export GH_TOKEN="$HOPE_PAT"
          DB="feed/pacman-unified/hope2333.db.tar.gz"
          DBRAW="feed/pacman-unified/hope2333.db"
          [ -f "$DB" ] && [ -f "$DBRAW" ] || { echo "::error::unified db missing"; exit 1; }
          # mirrorlist pkg rides alongside the db on every server: pacman
          # fetches pkg files per-server too, so the version the unified db
          # references must exist on each CDN (Pages serves the same file)
          MLPKG="$(find feed/pacman-unified -maxdepth 1 -name 'hope2333-mirrorlist-*.pkg.tar.xz' ! -name '*-latest-*' | head -1)"
          [ -n "$MLPKG" ] || { echo "::error::hope2333-mirrorlist pkg missing from unified pool"; exit 1; }
          MLALIAS="feed/pacman-unified/hope2333-mirrorlist-latest-1-any.pkg.tar.xz"
          cp "$MLPKG" "$MLALIAS"
          fail=0
          publish() {
            # both names: pacman fetches <repo>.db (uncompressed name); shipping
            # only the .tar.gz name made every github CDN 404 on -Sy and fall
            # through to the Pages fallback
            if gh release upload "$2" -R "$1" "$DB" "$DBRAW" "$MLPKG" "$MLALIAS" --clobber >/dev/null 2>&1; then
              echo "published hope2333.db{,.tar.gz} + mirrorlist pkg -> $1@$2"
            else
              echo "::warning ::db publish failed for $1@$2"; fail=1
            fi
          }
          publish Hope2333/codegraph-termux   "$(gh api repos/Hope2333/codegraph-termux/releases/latest --jq .tag_name)"
          publish Hope2333/opencode-termux    "$(gh api repos/Hope2333/opencode-termux/releases/latest --jq .tag_name)"
          publish Hope2333/MiMoCode-Termux    Push260829
          publish Hope2333/freebuff-termux    "$(gh api repos/Hope2333/freebuff-termux/releases/latest --jq .tag_name)"
          publish Hope2333/codebuff-termux    "$(gh api repos/Hope2333/codebuff-termux/releases/latest --jq .tag_name)"
          [ "$fail" -eq 0 ] || echo "::notice ::some db publishes failed; Pages fallback still serves the db"

      - name: Build mirrorlist package
        run: |
          set -euo pipefail
          VER="1.0.$(date -u +%Y%m%d)"
          FULLVER="${VER}-1"
          echo "MIRRORLIST_VER=$VER" >> "$GITHUB_ENV"
          REPOS=(codegraph-termux opencode-termux MiMoCode-Termux freebuff-termux codebuff-termux)
          # Pre-alpha prerelease repos: pin user-facing source URLs to the explicit
          # channel tag (GitHub forbids prereleases from being Latest, so
          # releases/latest/download would 404 for their assets).
          declare -A REPO_PIN=( [MiMoCode-Termux]=Push260829 )
          mkdir -p build/mirrorlist build/mirrorlist-deb/DEBIAN build/mirrorlist-deb/etc/apt/sources.list.d _site/repo/Termux/apt
          # a. pacman mirrorlist conf (single unified source [hope2333]:
          #    per-repo release CDN servers first, this Pages site last as fallback)
          : > build/mirrorlist/mirrorlist.conf
          {
            printf '[hope2333]\n'
            for r in "${REPOS[@]}"; do
              server="https://github.com/Hope2333/$r/releases/latest/download/"
              [ -z "${REPO_PIN[$r]:-}" ] || server="https://github.com/Hope2333/$r/releases/download/${REPO_PIN[$r]}/"
              printf 'Server = %s\n' "$server"
            done
            printf 'Server = https://hope2333.github.io/repo/Termux/pacman/\n'
            printf 'SigLevel = Optional TrustAll\n'
            printf '\n'
          } >> build/mirrorlist/mirrorlist.conf
          # b. install script (v10.0: the package OWNS the live conf via
          #    usr/etc/pacman.d/... + backup=, so the hook only manages the
          #    Include line in pacman.conf. v10 wires it SECTION-AWARE (inside
          #    [hope2333], never blind-appended at EOF where it could land in
          #    a later section) and strips the transient inline bootstrap
          #    lines (Pages Server / SigLevel) from [hope2333] once the owned
          #    conf — which carries both — is in place. v9 semantics kept:
          #    no conf copy, no conf rm; backup= still protects user edits.
          #    quoted heredoc: $P must land in the hook LITERALLY (expanded at hook time).
          cat > build/mirrorlist/hope2333-mirrorlist.install <<'HOOK'
          post_install() { _apply; }
          post_upgrade() { _apply; }
          pre_remove() { _remove; }
          post_remove() { _remove; }
          _apply() {
            P="${PREFIX:-/data/data/com.termux/files/usr}"
            [ -f "$P/etc/pacman.conf" ] || return 0
            mkdir -p "$P/etc/pacman.d"
            if ! grep -q 'pacman.d/hope2333-mirrorlist.conf' "$P/etc/pacman.conf"; then
              awk -v inc="Include = $P/etc/pacman.d/hope2333-mirrorlist.conf" '
                BEGIN { wired = 0 }
                /^\[hope2333\]$/ { print; if (!wired) { print inc; wired = 1 } next }
                { print }
                END { if (!wired) { print ""; print "[hope2333]"; print inc } }
              ' "$P/etc/pacman.conf" > "$P/etc/pacman.conf.tmp" \
                && mv "$P/etc/pacman.conf.tmp" "$P/etc/pacman.conf"
            fi
            _clean_inline
          }
          _clean_inline() {
            P="${PREFIX:-/data/data/com.termux/files/usr}"
            [ -f "$P/etc/pacman.conf" ] || return 0
            awk '
              /^\[hope2333\]$/ { inhope = 1; print; next }
              /^\[/ { inhope = 0; print; next }
              { if (!(inhope && (/^Server = https:\/\/hope2333\.github\.io\/repo\/Termux\/pacman\// || /^SigLevel[ \t]*=/))) print }
            ' "$P/etc/pacman.conf" > "$P/etc/pacman.conf.tmp" \
              && mv "$P/etc/pacman.conf.tmp" "$P/etc/pacman.conf" || true
          }
          _remove() {
            P="${PREFIX:-/data/data/com.termux/files/usr}"
            sed -i '/pacman.d\/hope2333-mirrorlist.conf/d' "$P/etc/pacman.conf" 2>/dev/null || true
          }
          HOOK
          # c. PKGBUILD
          {
            printf 'pkgname=hope2333-mirrorlist\n'
            printf 'pkgver=%s\n' "$VER"
            printf 'pkgrel=1\n'
            printf 'pkgdesc="hope2333 software source mirrorlist (managed config)"\n'
            printf 'arch=(any)\n'
            printf 'url="https://github.com/Hope2333/hope2333.github.io"\n'
            printf 'license=(MIT)\n'
            printf 'install=hope2333-mirrorlist.install\n'
            # backup path is RootDir-relative: Termux pacman RootDir is
            # /data/data/com.termux/files, so $pkgdir/usr/etc/... lands at
            # $PREFIX/etc/... and must be declared WITH the usr/ prefix.
            printf "backup=('usr/etc/pacman.d/hope2333-mirrorlist.conf')\n"
            printf 'package() {\n'
            printf '  install -Dm644 /work/mirrorlist.conf "$pkgdir/usr/share/hope2333-mirrorlist/mirrorlist.conf"\n'
            printf '  install -Dm644 /work/mirrorlist.conf "$pkgdir/usr/etc/pacman.d/hope2333-mirrorlist.conf"\n'
            printf '}\n'
          } > build/mirrorlist/PKGBUILD
          # d. build pacman any-pkg in archlinux container (makepkg refuses root)
          docker run --rm -v "$PWD/build/mirrorlist:/work" archlinux bash -c 'pacman -Sy --noconfirm base-devel >/dev/null && useradd -m builder && chown -R builder /work && su builder -c "cd /work && echo PKGEXT=.pkg.tar.xz > /home/builder/.makepkg.conf && makepkg -f" && ls -la /work'
          # e. Pages pkg drop (meta db retired: hope2333-mirrorlist ships in
          #    the unified [hope2333] db — no separate repo/db anymore)
          PKG="$(find build/mirrorlist -maxdepth 1 -name 'hope2333-mirrorlist-*.pkg.tar.xz' | head -1)"
          [ -n "$PKG" ] || { echo "::error::mirrorlist pkg not found on host after makepkg"; ls -la build/mirrorlist || true; exit 1; }
          echo "mirrorlist pkg resolved: $PKG"
          cp "$PKG" _site/repo/Termux/pacman/
          cp "$PKG" build/mirrorlist/hope2333-mirrorlist-latest-1-any.pkg.tar.xz
          cp build/mirrorlist/hope2333-mirrorlist-latest-1-any.pkg.tar.xz _site/repo/Termux/pacman/
          # f. deb aarch64
          {
            printf 'Package: hope2333-mirrorlist\n'
            printf 'Version: %s\n' "$FULLVER"
            printf 'Section: misc\n'
            printf 'Priority: optional\n'
            printf 'Architecture: aarch64\n'
            printf 'Maintainer: Hope2333 <hope2333@users.noreply.github.com>\n'
            printf 'Description: hope2333 apt source list (managed config)\n'
          } > build/mirrorlist-deb/DEBIAN/control
          {
            printf '#!/bin/sh\n'
            printf '# data file etc/apt/sources.list.d/hope2333.list is unpacked by dpkg before this runs\n'
            printf 'test -f "$PREFIX/etc/apt/sources.list.d/hope2333.list" && chmod 0644 "$PREFIX/etc/apt/sources.list.d/hope2333.list" || true\n'
          } > build/mirrorlist-deb/DEBIAN/postinst
          chmod 0755 build/mirrorlist-deb/DEBIAN/postinst
          : > build/mirrorlist-deb/etc/apt/sources.list.d/hope2333.list
          for r in "${REPOS[@]}"; do
            apt_base="https://github.com/Hope2333/$r/releases/latest/download/"
            [ -z "${REPO_PIN[$r]:-}" ] || apt_base="https://github.com/Hope2333/$r/releases/download/${REPO_PIN[$r]}/"
            printf 'deb [trusted=yes arch=aarch64] %s ./\n' "$apt_base" >> build/mirrorlist-deb/etc/apt/sources.list.d/hope2333.list
          done
          dpkg-deb --build --root-owner-group build/mirrorlist-deb "hope2333-mirrorlist_${FULLVER}_aarch64.deb"
          # g. apt flat bootstrap on io
          cp "hope2333-mirrorlist_${FULLVER}_aarch64.deb" _site/repo/Termux/apt/
          ( cd _site/repo/Termux/apt && dpkg-scanpackages . /dev/null > Packages && gzip -9kc Packages > Packages.gz && apt-ftparchive release . > Release )

      - name: Upload mirrorlist release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VER="$MIRRORLIST_VER"
          PKG="build/mirrorlist/hope2333-mirrorlist-${VER}-1-any.pkg.tar.xz"
          DEB="_site/repo/Termux/apt/hope2333-mirrorlist_${VER}-1_aarch64.deb"
          gh release view mirrorlist -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create mirrorlist -R "$GITHUB_REPOSITORY" --title "hope2333-mirrorlist" --notes "rolling mirrorlist package (latest-only)"
          gh release upload mirrorlist -R "$GITHUB_REPOSITORY" "$PKG" "build/mirrorlist/hope2333-mirrorlist-latest-1-any.pkg.tar.xz" "$DEB" --clobber

      - name: Stamp build time into homepage
        run: |
          set -euo pipefail
          sed -i "s/__BUILD_STAMP__/$(date -u '+%Y-%m-%d %H:%M:%S') UTC/" _site/index.html
          ! grep -q '__BUILD_STAMP__' _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
